[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inferforge"
version = "0.1.0"
description = "Arm-native AI inference optimization platform foundations."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
  { name = "InferForge contributors" }
]
dependencies = [
  "fastapi>=0.111.0",
  "pydantic>=2.7.0",
  "typer>=0.12.0",
  "uvicorn[standard]>=0.30.0"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0"
]

[project.scripts]
inferforge = "inferforge.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["apps", "inferforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
